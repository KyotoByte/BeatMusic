      <feDisplacementMap in="SourceGraphic" in2="nb" scale="7" xChannelSelector="R" yChannelSelector="G"/>

  </defs>

  <symbol id="i-queue" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r=".6" fill="currentColor"/><circle cx="4" cy="12" r=".6" fill="currentColor"/><circle cx="4" cy="18" r=".6" fill="currentColor"/></g></symbol>

  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 4-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-vol-high" viewBox="0 0 24 24"><path d="M3 9.5v5h3.5L11 19V5L6.5 9.5z" fill="currentColor"/><path d="M14.5 8.5a5 5 0 0 1 0 7M17.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 10.5 5-3v9l-5-3z" fill="currentColor"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm8.6 4.6-1.9.4a6.9 6.9 0 0 1-.7 1.6l1.1 1.6-1.6 1.6-1.6-1.1a6.9 6.9 0 0 1-1.6.7l-.4 1.9h-2.3l-.4-1.9a6.9 6.9 0 0 1-1.6-.7l-1.6 1.1-1.6-1.6 1.1-1.6a6.9 6.9 0 0 1-.7-1.6l-1.9-.4v-2.3l1.9-.4a6.9 6.9 0 0 1 .7-1.6L4.5 7.2l1.6-1.6 1.6 1.1a6.9 6.9 0 0 1 1.6-.7l.4-1.9h2.3l.4 1.9a6.9 6.9 0 0 1 1.6.7l1.6-1.1 1.6 1.6-1.1 1.6a6.9 6.9 0 0 1 .7 1.6l1.9.4z" fill="currentColor"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="9" width="3" height="6" rx="1.5" fill="currentColor"/><rect x="7.5" y="5" width="3" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="2.5" width="3" height="19" rx="1.5" fill="currentColor"/><rect x="16.5" y="7" width="3" height="10" rx="1.5" fill="currentColor"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="sidebar glass" aria-label="Navigation">
    <a class="brand" href="#/home" aria-label="BeatMusic home"><span class="brand-mark"><svg><use href="#i-logo"/></svg></span><span>BeatMusic</span></a>
    <label class="side-search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="side-search" type="search" placeholder="Search" autocomplete="off" aria-label="Search songs, artists, albums">
    </label>
    <nav class="side-nav">
      <a href="#/home" data-tab="home"><svg><use href="#i-home"/></svg>Home</a>
      <a href="#/browse" data-tab="browse"><svg><use href="#i-browse"/></svg>Browse</a>
      <a href="#/radio" data-tab="radio"><svg><use href="#i-radio"/></svg>Radio</a>
      <p class="side-head">Library</p>
      <a href="#/library" data-tab="library"><svg><use href="#i-library"/></svg>Library</a>
      <a href="#/liked" data-tab="liked"><svg><use href="#i-heart"/></svg>Liked Songs</a>
      <a href="#/recent" data-tab="recent"><svg><use href="#i-queue"/></svg>Recently Played</a>
      <div id="side-playlists" class="side-playlists"></div>
    </nav>
    <div class="side-foot">
      <a href="#/settings" data-tab="settings"><svg><use href="#i-gear"/></svg>Settings</a>
      <p class="credit"><a href="https://github.com/KyotoByte" target="_blank" rel="noopener">KyotoByte</a> · <a href="LICENSE.txt" target="_blank" rel="noopener">Licence</a></p>
    </div>
  </aside>

  <main id="main" class="main" tabindex="-1">
    <div id="view" class="view"></div>
  </main>

  <div class="miniplayer glass" id="mini" hidden>
    <button class="mini-open" id="mini-open" aria-label="Open Now Playing">
      <img class="mini-art" id="mini-art" alt="" width="44" height="44">
      <span class="mini-meta"><span class="mini-title" id="mini-title"></span><span class="mini-sub" id="mini-sub"></span></span>
    </button>
    <span class="badge-preview" id="mini-badge" hidden>Preview</span>
    <div class="mini-ctrls">
      <button class="icon-btn desk-only" id="mini-prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="icon-btn" id="mini-play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="mini-next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="icon-btn desk-only" id="mini-lyrics" aria-label="Lyrics"><svg><use href="#i-lyrics"/></svg></button>
      <button class="icon-btn desk-only" id="mini-queue" aria-label="Up Next"><svg><use href="#i-queue"/></svg></button>
    </div>
    <div class="mini-progress" aria-hidden="true"><i id="mini-bar"></i></div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Tabs">
    <div class="tabs glass">
      <span class="tab-pill" id="tab-pill" aria-hidden="true"></span>
      <a href="#/home" data-tab="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#/browse" data-tab="browse"><svg><use href="#i-browse"/></svg><span>Browse</span></a>
      <a href="#/radio" data-tab="radio"><svg><use href="#i-radio"/></svg><span>Radio</span></a>
      <a href="#/library" data-tab="library"><svg><use href="#i-library"/></svg><span>Library</span></a>
    </div>
    <a class="tab-search glass" href="#/search" data-tab="search" aria-label="Search"><svg><use href="#i-search"/></svg></a>
  </nav>
</div>

<section class="np" id="np" aria-label="Now Playing" aria-hidden="true" inert>
  <div class="np-bg" aria-hidden="true"><div class="np-blob b1"></div><div class="np-blob b2"></div><div class="np-blob b3"></div><img id="np-bgimg" alt=""></div>
  <div class="np-inner">
    <header class="np-top">
      <button class="np-grabber" id="np-close" aria-label="Close Now Playing"><span></span></button>
    </header>
    <div class="np-body">
      <div class="np-left">
        <div class="np-art-wrap" id="np-art-wrap">
          <img class="np-art" id="np-art" alt="">
          <div class="np-video" id="np-video"><div id="yt-host"></div></div>
        </div>
        <div class="np-meta">
          <div class="np-titles">
            <h2 id="np-title" class="marquee"></h2>
            <button class="np-artist" id="np-artist"></button>
          </div>
          <span class="badge-preview" id="np-badge" hidden>Preview</span>
          <button class="round-glass" id="np-like" aria-label="Like" aria-pressed="false"><svg><use href="#i-heart"/></svg></button>
          <button class="round-glass" id="np-more" aria-label="More options"><svg><use href="#i-more"/></svg></button>
        </div>
        <div class="np-scrub">
          <input type="range" id="np-seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="np-times"><span id="np-cur">0:00</span><span id="np-src" class="np-src"></span><span id="np-rem">-0:00</span></div>
        </div>
        <div class="np-ctrls">
          <button class="icon-btn sm" id="np-shuffle" aria-label="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn lg" id="np-prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
          <button class="icon-btn xl" id="np-play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
          <button class="icon-btn lg" id="np-next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
          <button class="icon-btn sm" id="np-repeat" aria-label="Repeat: off" aria-pressed="false"><svg><use href="#i-repeat"/></svg><b class="rep1">1</b></button>
        </div>
        <div class="np-vol">
          <svg aria-hidden="true"><use href="#i-vol-low"/></svg>
          <input type="range" id="np-volume" min="0" max="100" value="100" aria-label="Volume">
          <svg aria-hidden="true"><use href="#i-vol-high"/></svg>
        </div>
        <div class="np-tools">
          <button class="tool" id="np-tab-lyrics" aria-label="Lyrics" aria-pressed="false"><svg><use href="#i-lyrics"/></svg></button>
          <button class="tool" id="np-tab-video" aria-label="Video" aria-pressed="false"><svg><use href="#i-video"/></svg></button>
          <button class="tool" id="np-tab-queue" aria-label="Up Next" aria-pressed="false"><svg><use href="#i-queue"/></svg></button>
        </div>
      </div>
      <div class="np-right" id="np-right">
        <div class="np-panel lyrics-panel" id="lyrics-panel" role="region" aria-label="Lyrics"></div>
        <div class="np-panel queue-panel" id="queue-panel" role="region" aria-label="Up Next" hidden></div>
      </div>
    </div>
  </div>
</section>

<div class="sheet-scrim" id="menu-scrim" hidden></div>
<div class="menu glass" id="menu" role="menu" hidden></div>
<div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>
<audio id="audio" preload="none"></audio>
<noscript><p style="padding:24px">BeatMusic needs JavaScript.</p></noscript>
</body>
</html>
